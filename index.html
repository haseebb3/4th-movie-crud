  <div class="backDrop modelCloseBtn" id="backDrop"></div>
  <div class="modelModel" id="movieModel">
    <form id="movieForm">
      <div class="card">
        <div class="card-header d-flex justify-content-between">
          <h4>Enter Movie Details</h4>
          <i class="fa-regular fa-circle-xmark fa-2x text-danger modelCloseBtn" role="button"></i>
        </div>
        <div class="card-body">
          <div class="form-group">
            <label for="movieName">Movie Name<span class="text-danger">*</span></label>
            <input required type="text" id="movieName" class="form-control">
          </div>
          <div class="form-group">
            <label for="movieImage">Movie Image</label>
            <input type="text" id="movieImage" class="form-control">
          </div>
          <div class="form-group">
            <label for="movieDescription">Movie Description<span class="text-danger">*</span></label>
            <textarea required id="movieDescription" rows="4" class="form-control"></textarea>
          </div>
          <div class="form-group">
            <label for="movieRating">Movie Rating<span class="text-danger">*</span></label>
            <input required min="1" max="5" step=".1" type="number" id="movieRating" class="form-control">
          </div>
        </div>
        <div class="card-footer d-flex justify-content-between">
          <button class="button btn btn-sm secondary-btn" id="addMovieBtn">Add Movie</button>
          <button type="button" class="button btn btn-sm secondary-btn d-none" id="updateMovieBtn">Update Movie</button>
          <button type="button" class="button btn btn-sm primary-btn modelCloseBtn" id="closeModelBtn">Close</div>
        </button>
      </div>
    </form>
